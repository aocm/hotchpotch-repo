services:
  nexus:
    image: sonatype/nexus3:3.78.2-java17-ubi
    container_name: sample-java-nexus-nexus
    ports:
      - "8081:8081"
    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m
        -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    volumes:
      - nexus-data:/nexus-data

  jdk:
    build:
      context: .
      dockerfile: docker/jdk/Dockerfile
    container_name: sample-java-nexus-jdk
    working_dir: /workspace
    command: sleep infinity
    environment:
      NEXUS_BASE_URL: http://nexus:8081
      NEXUS_REPOSITORY_NAME: legacy-maven-hosted
      NEXUS_USERNAME: admin
      NEXUS_PASSWORD: admin123
    volumes:
      - ./:/workspace
    depends_on:
      - nexus
    stdin_open: true
    tty: true

volumes:
  nexus-data:
